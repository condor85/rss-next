# Compila l'APK Android su GitHub, senza installare nulla sul tuo PC.
# Uso: carica il progetto su un repository GitHub → scheda "Actions" → "APK Android" → Run workflow
# Al termine scarichi l'APK dalla sezione "Artifacts".
name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepara Android SDK/NDK (già presenti sul runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/ndk" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Installa tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Genera il progetto Android
        working-directory: src-tauri
        run: cargo tauri android init --ci

      - name: Compila l'APK ottimizzato (arm64)
        working-directory: src-tauri
        run: cargo tauri android build --apk --target aarch64

      - name: Allinea e firma l'APK
        run: |
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -path "*release*" | head -n 1)
          echo "APK non firmato: $UNSIGNED"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks .github/signing/lettore-rss.jks \
            --ks-pass pass:android --key-pass pass:android \
            --out lettore-rss.apk aligned.apk
          "$BT/apksigner" verify --verbose lettore-rss.apk | head -5
          ls -la lettore-rss.apk

      - name: Pubblica l'APK nelle Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" lettore-rss.apk \
            --title "Lettore RSS build ${{ github.run_number }}" \
            --notes "APK arm64 ottimizzato. Scaricalo sul telefono e aprilo per installarlo. Le build successive si installano sopra la precedente senza perdere i dati."
