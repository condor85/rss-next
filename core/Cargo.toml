[package]
name = "rss_core"
version = "0.1.0"
edition = "2021"
description = "Nucleo del lettore RSS: download, parsing RSS/Atom/JSON Feed, OPML, scoperta dei feed"
license = "GPL-3.0-or-later"

[dependencies]
feed-rs = "3.0.0"
futures = "0.3.34"
opml = "1.1.6"
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time"] }
